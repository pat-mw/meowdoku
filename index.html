<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Deliberately zoomable. Locking the viewport with user-scalable=no is the
      usual way to stop a double-tap on a cell zooming the page, but it also
      stops a player who needs to magnify the board from doing so, and it fails
      WCAG 1.4.4. The board suppresses the double-tap zoom on its own instead:
      touch-action is none on the grid and pointerdown is prevented, so the
      gesture never reaches the browser, while the rest of the page still zooms.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Meowdoku</title>
    <meta
      name="description"
      content="A cosy logic puzzle. One cat per colour, row and column — and cats can never touch."
    />
    <meta name="theme-color" content="#F5F0EB" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Meowdoku" />
    <link rel="preload" href="/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
